name: Build & Deploy iOS App

on:
  push:
    branches: [main, release/flutter, payment]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sélectionner Xcode latest
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: arm64

      - name: Flutter precache iOS
        run: flutter precache --ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Calculer la version marketing
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f1,2)
          echo "BUILD_NAME=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Garantir et Injecter Runner.entitlements (Fix Push Notifications)
        run: |
          mkdir -p ios/Runner
          cat << 'EOF' > ios/Runner/Runner.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>aps-environment</key>
          	<string>production</string>
          </dict>
          </plist>
          EOF

          perl -0777 -pi -e 's/(PRODUCT_NAME = Runner;)/$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = Runner\/Runner.entitlements;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Importer le certificat P12 existant dans le Keychain
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/certificate.p12"

          # 1. Nettoyer et décoder le secret P12 (supprime espaces et retours à la ligne)
          echo "$P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$P12_PATH"

          # Vérifier que le fichier P12 est non vide
          if [ ! -s "$P12_PATH" ]; then
            echo "::error::Le fichier P12 décodé est vide. Vérifiez votre Secret P12_BASE64."
            exit 1
          fi

          # 2. Créer et déverrouiller le Keychain temporaire
          security create-keychain -p "temppass" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temppass" "$KEYCHAIN_PATH"

          # 3. Importer le certificat P12 dans le Keychain
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          # 4. Définir le Keychain par défaut et autoriser la signature sans prompt
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "temppass" "$KEYCHAIN_PATH"

      - name: Récupérer le Profil de Provisionnement via Fastlane (App Store Connect API)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          BUNDLE_ID: com.kartapp.app
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: true
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          # Créer le Fastfile qui télécharge UNIQUEMENT le profil existant (sans toucher aux certificats)
          mkdir -p ios/fastlane
          cat << 'FASTFILE_EOF' > ios/fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            lane :get_profiles_only do
              app_store_connect_api_key(
                key_id: ENV["KEY_ID"],
                issuer_id: ENV["ISSUER_ID"],
                key_content: ENV["KEY_CONTENT"],
                is_key_content_base64: false
              )
              get_provisioning_profile(
                app_identifier: ENV["BUNDLE_ID"],
                adhoc: false,
                force: false,
                filename: "appstore.mobileprovision"
              )
            end
          end
          FASTFILE_EOF

          cd ios
          fastlane ios get_profiles_only

          # Extraire l'UUID du profil téléchargé
          PROFILE_PATH=$(find . -name "appstore.mobileprovision" | head -1)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i "$PROFILE_PATH") 2>/dev/null || echo "")

          if [ -z "$PROFILE_UUID" ]; then
            PROFILE_UUID=$(grep -aA1 "UUID" "$PROFILE_PATH" | grep -oE '[a-f0-9]{8}-([a-f0-9]{4}-){3}[a-f0-9]{12}' | head -1)
          fi

          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::Impossible de déterminer l'UUID du profil de provisionnement."
            exit 1
          fi

          echo "UUID extrait : $PROFILE_UUID"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          echo "$PROFILE_UUID" > profile_uuid.txt

      - name: Configuration de la signature dans Release.xcconfig
        run: |
          PROFILE_UUID=$(cat ios/profile_uuid.txt)
          echo "DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_UUID" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_STYLE = Manual" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = Apple Distribution" >> ios/Flutter/Release.xcconfig

      - name: Générer les fichiers iOS (Flutter Build)
        run: |
          flutter build ios --release --no-codesign --no-pub --build-number=${{ github.run_number }} --build-name=$BUILD_NAME

      - name: Créer le fichier ExportOptions
        run: |
          PROFILE_UUID=$(cat ios/profile_uuid.txt)
          TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          
          if [ -z "$PROFILE_UUID" ]; then
            echo "::error::PROFILE_UUID est vide."
            exit 1
          fi

          cat << _EXPORT_PLIST_ > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.kartapp.app</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          _EXPORT_PLIST_

          # Valider la structure Plist
          plutil -lint ios/ExportOptions.plist

      - name: Archiver et Signer avec Xcodebuild
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -o pipefail
          
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            archive 2>&1 | tee /tmp/xcode_archive.log || ARCHIVE_FAILED=true

          if [ "$ARCHIVE_FAILED" = "true" ]; then
            echo "::error::================ ÉCHEC DE L'ARCHIVAGE XCODEBUILD ================"
            grep -i -E "(error:|fatal error:|failed:|error :)" /tmp/xcode_archive.log | grep -v "0 errors" | tail -n 30 | while read -r line; do
              echo "::error::$line"
            done
            echo "::error::================================================================="
            exit 1
          fi

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8 2>&1 | tee /tmp/xcode_export.log || EXPORT_FAILED=true

          if [ "$EXPORT_FAILED" = "true" ]; then
            echo "::error::================ ÉCHEC DE L'EXPORTATION IPA ================"
            grep -i -E "(error:|fatal error:|failed:|error :)" /tmp/xcode_export.log | grep -v "0 errors" | tail -n 30 | while read -r line; do
              echo "::error::$line"
            done
            echo "::error::================================================================="
            exit 1
          fi

      - name: Vérifier l'entitlement aps-environment
        run: |
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Aucun .ipa trouvé dans build/ios/ipa."
            exit 1
          fi

          rm -rf /tmp/ipa_check && mkdir -p /tmp/ipa_check
          unzip -q "$IPA_PATH" -d /tmp/ipa_check
          APP_PATH=$(find /tmp/ipa_check/Payload -maxdepth 1 -name "*.app" | head -1)

          codesign -d --entitlements :- "$APP_PATH" > /tmp/entitlements.plist 2>/tmp/codesign_err.txt
          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" /tmp/entitlements.plist 2>/dev/null || echo "MISSING")
          echo "::notice::aps-environment signé dans le .ipa exporté : $APS_ENV"

      - name: Sauvegarder le fichier IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-iOS
          path: build/ios/ipa/*.ipa

      - name: Soumettre à l'App Store Connect
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/flutter'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose

      - name: Nettoyer le trousseau temporaire
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
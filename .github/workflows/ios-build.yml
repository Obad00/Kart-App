name: Build & Deploy iOS App

on:
  push:
    branches:
      - main
      - release/flutter
      - payment

jobs:
  build:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.kartapp.app
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # XCODE
      # ============================================================
      - name: Sélectionner Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Vérifier Xcode
        run: |
          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version


      # ============================================================
      # KEYCHAIN INITIALIZATION
      # ============================================================
      - name: Initialiser le Keychain CI
        run: |
          echo "======================================"
          echo "KEYCHAIN SETUP"
          echo "======================================"

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="tempci123password"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security default-keychain -s "$KEYCHAIN_PATH"


      # ============================================================
      # PYTHON / APP STORE CONNECT API
      # ============================================================
      - name: Installer les dépendances API Apple
        run: |
          pip3 install PyJWT cryptography --break-system-packages


      # ============================================================
      # CRÉER LA CLÉ APP STORE CONNECT
      # ============================================================
      - name: Configurer App Store Connect API
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -e

          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s' "$KEY_CONTENT" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          echo "Clé App Store Connect configurée."


      # ============================================================
      # VÉRIFIER BUNDLE ID + PUSH NOTIFICATIONS
      # ============================================================
      - name: Vérifier Push Notifications
        run: |
          set -e

          python3 <<'PYEOF'
          import jwt
          import time
          import json
          import urllib.request
          import urllib.parse
          import os
          import sys

          key_id = os.environ["KEY_ID"]
          issuer_id = os.environ["ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]

          key_path = os.path.expanduser(
              f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8"
          )

          with open(key_path, "r") as f:
              private_key = f.read()

          def make_token():
              now = int(time.time())

              payload = {
                  "iss": issuer_id,
                  "iat": now,
                  "exp": now + 1200,
                  "aud": "appstoreconnect-v1"
              }

              return jwt.encode(
                  payload,
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id}
              )

          def api_request(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {make_token()}",
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read())

          print("======================================")
          print("APPLE APP ID")
          print("======================================")

          encoded_bundle = urllib.parse.quote(bundle_id, safe="")

          url = (
              "https://api.appstoreconnect.apple.com/v1/bundleIds"
              f"?filter[identifier]={encoded_bundle}"
          )

          bundle_data = api_request(url)

          if not bundle_data.get("data"):
              print(
                  f"::error::Bundle ID {bundle_id} introuvable."
              )
              sys.exit(1)

          bundle = bundle_data["data"][0]
          bundle_resource_id = bundle["id"]

          print(f"Bundle ID : {bundle_id}")
          print(f"Resource ID : {bundle_resource_id}")

          print("")
          print("======================================")
          print("CAPABILITIES")
          print("======================================")

          caps_url = (
              "https://api.appstoreconnect.apple.com/v1/bundleIds/"
              f"{bundle_resource_id}/bundleIdCapabilities"
          )

          caps_data = api_request(caps_url)

          capabilities = [
              item["attributes"]["capabilityType"]
              for item in caps_data.get("data", [])
          ]

          print("Capabilities :", capabilities)

          if "PUSH_NOTIFICATIONS" not in capabilities:
              print(
                  "::error::Push Notifications n'est pas activé "
                  f"sur {bundle_id}."
              )

              sys.exit(1)

          print("✅ Push Notifications est activé.")

          PYEOF


      # ============================================================
      # FLUTTER
      # ============================================================
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64

      - name: Vérifier Flutter
        run: |
          flutter --version
          dart --version


      # ============================================================
      # FLUTTER PRECACHE & DEPENDENCIES
      # ============================================================
      - name: Flutter precache iOS
        run: flutter precache --ios

      - name: Installer les dépendances Flutter
        run: flutter pub get


      # ============================================================
      # VERSION
      # ============================================================
      - name: Calculer la version
        run: |
          set -e

          BASE_VERSION=$(grep '^version:' pubspec.yaml \
            | sed 's/version: *//' \
            | cut -d'+' -f1)

          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f1,2)

          BUILD_NAME="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"

          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"

          echo "Version marketing : $BUILD_NAME"
          echo "Build number      : $GITHUB_RUN_NUMBER"


      # ============================================================
      # FLUTTER IOS PROJECT
      # ============================================================
      - name: Générer le projet iOS
        run: |
          set -e

          echo "DEVELOPMENT_TEAM = $TEAM_ID" \
            >> ios/Flutter/Release.xcconfig

          echo "DEVELOPMENT_TEAM = $TEAM_ID" \
            >> ios/Flutter/Debug.xcconfig

          flutter build ios \
            --release \
            --no-codesign \
            --no-pub \
            --build-number="$GITHUB_RUN_NUMBER" \
            --build-name="$BUILD_NAME"


      # ============================================================
      # PODS
      # ============================================================
      - name: Installer CocoaPods
        run: |
          set -e
          cd ios
          pod install --repo-update


      # ============================================================
      # CONFIGURER LES ENTITLEMENTS RUNNER
      # ============================================================
      - name: Configurer les entitlements Push Notifications
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURATION ENTITLEMENTS"
          echo "======================================"

          cat > ios/Runner/Runner.entitlements <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

          echo "Entitlements créés :"
          cat ios/Runner/Runner.entitlements


      # ============================================================
      # NETTOYER LES REFERENCES ENTITLEMENTS DES PODS
      # ============================================================
      - name: Corriger les entitlements des Pods
        run: |
          set -e

          find ios/Pods -name "*.pbxproj" -type f -print0 |
          while IFS= read -r -d '' file; do
            if grep -q "Runner/Runner.entitlements" "$file"; then
              sed -i '' 's#Runner/Runner.entitlements##g' "$file"
            fi
          done


      # ============================================================
      # CERTIFICAT DISTRIBUTION + PROFILE
      # ============================================================
      - name: Générer certificat Distribution et profil App Store
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -e

          python3 <<'PYEOF'
          import jwt
          import time
          import json
          import urllib.request
          import urllib.parse
          import base64
          import os
          import subprocess
          import sys

          key_id = os.environ["KEY_ID"]
          issuer_id = os.environ["ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          team_id = os.environ["TEAM_ID"]

          key_path = os.path.expanduser(
              f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8"
          )

          with open(key_path) as f:
              private_key = f.read()

          def token():
              now = int(time.time())
              payload = {
                  "iss": issuer_id,
                  "iat": now,
                  "exp": now + 1200,
                  "aud": "appstoreconnect-v1"
              }
              return jwt.encode(
                  payload,
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id}
              )

          def request(url, data=None, method=None):
              headers = {
                  "Authorization": f"Bearer {token()}",
                  "Content-Type": "application/json"
              }
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method or ("POST" if body else "GET")
              )
              with urllib.request.urlopen(req) as response:
                  content = response.read()
                  return json.loads(content) if content else {}

          print("======================================")
          print("CERTIFICAT DISTRIBUTION")
          print("======================================")

          # Génération d'une nouvelle clé privée locale
          subprocess.run(["openssl", "genrsa", "-out", "/tmp/distribution.key", "2048"], check=True)
          subprocess.run([
              "openssl", "req", "-new", "-key", "/tmp/distribution.key",
              "-out", "/tmp/distribution.csr", "-subj", "/CN=Apple Distribution/O=KartApp/C=US"
          ], check=True)

          with open("/tmp/distribution.csr", "rb") as f:
              csr = base64.b64encode(f.read()).decode()

          cert_data = request(
              "https://api.appstoreconnect.apple.com/v1/certificates",
              {
                  "data": {
                      "type": "certificates",
                      "attributes": {
                          "certificateType": "IOS_DISTRIBUTION",
                          "csrContent": csr
                      }
                  }
              }
          )

          cert_id = cert_data["data"]["id"]
          cert_content = cert_data["data"]["attributes"]["certificateContent"]
          print(f"✅ Nouveau certificat créé : {cert_id}")

          with open("/tmp/distribution.cer", "wb") as f:
              f.write(base64.b64decode(cert_content))

          # Import dans le Keychain CI
          subprocess.run(["openssl", "x509", "-inform", "DER", "-in", "/tmp/distribution.cer", "-out", "/tmp/distribution.pem"], check=True)
          subprocess.run([
              "openssl", "pkcs12", "-export", "-inkey", "/tmp/distribution.key",
              "-in", "/tmp/distribution.pem", "-out", "/tmp/distribution.p12",
              "-passout", "pass:tempci123", "-legacy"
          ], check=True)

          keychain = os.environ["RUNNER_TEMP"] + "/app-signing.keychain-db"

          subprocess.run(["security", "import", "/tmp/distribution.p12", "-k", keychain, "-P", "tempci123", "-A"], check=True)
          subprocess.run(["security", "set-key-partition-list", "-S", "apple-tool:,apple:", "-s", "-k", "tempci123password", keychain], check=True)

          # Bundle ID lookup
          encoded_bundle = urllib.parse.quote(bundle_id, safe="")
          bundle_data = request(f"https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]={encoded_bundle}")
          bundle_resource_id = bundle_data["data"][0]["id"]

          # Nettoyage anciens profils
          profiles = request("https://api.appstoreconnect.apple.com/v1/profiles?filter[profileType]=IOS_APP_STORE&limit=50")
          for profile in profiles.get("data", []):
              if "KartApp AppStore CI" in profile["attributes"]["name"]:
                  try:
                      request(f"https://api.appstoreconnect.apple.com/v1/profiles/{profile['id']}", method="DELETE")
                  except Exception as e:
                      pass

          # Création Profil
          profile_data = request(
              "https://api.appstoreconnect.apple.com/v1/profiles",
              {
                  "data": {
                      "type": "profiles",
                      "attributes": {
                          "name": f"KartApp AppStore CI {int(time.time())}",
                          "profileType": "IOS_APP_STORE"
                      },
                      "relationships": {
                          "bundleId": {"data": {"type": "bundleIds", "id": bundle_resource_id}},
                          "certificates": {"data": [{"type": "certificates", "id": cert_id}]}
                      }
                  }
              }
          )

          profile = profile_data["data"]
          profile_content = profile["attributes"]["profileContent"]
          profile_uuid = profile["attributes"]["uuid"]

          profiles_dir = os.path.expanduser("~/Library/MobileDevice/Provisioning Profiles")
          os.makedirs(profiles_dir, exist_ok=True)
          destination = os.path.join(profiles_dir, f"{profile_uuid}.mobileprovision")

          with open(destination, "wb") as f:
              f.write(base64.b64decode(profile_content))

          print(f"✅ Provisioning profile {profile_uuid} installé.")

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PROFILE_UUID={profile_uuid}\n")

          PYEOF


      # ============================================================
      # CONFIGURATION FINALE XCODE
      # ============================================================
      - name: Appliquer le profil de provisioning
        run: |
          set -e

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          project.targets.each do |target|
            next unless target.name == 'Runner'
            target.build_configurations.each do |config|
              settings = config.build_settings
              settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.kartapp.app'
              settings['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']
              settings['CODE_SIGN_STYLE'] = 'Manual'
              settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = 'Apple Distribution'
              settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROFILE_UUID']
              settings['CODE_SIGN_ENTITLEMENTS'] = 'Runner/Runner.entitlements'
            end
          end

          project.save
          puts "✅ Runner configuré."
          RUBY


      # ============================================================
      # CLEAN
      # ============================================================
      - name: Nettoyer DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*


      # ============================================================
      # ARCHIVE
      # ============================================================
      - name: Archiver l'application
        run: |
          set -o pipefail

          echo "======================================"
          echo "ARCHIVE"
          echo "======================================"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGNING_ALLOWED=YES \
            archive 2>&1 | tee /tmp/xcodebuild-archive.log


      # ============================================================
      # DIAGNOSTIC LOGS SI ÉCHEC
      # ============================================================
      - name: Afficher les logs d'échec Xcode
        if: failure()
        run: |
          echo "======================================"
          echo "XCODEBUILD ERROR LOGS"
          echo "======================================"
          grep -i -C 5 "error:" /tmp/xcodebuild-archive.log || cat /tmp/xcodebuild-archive.log | tail -n 120


      # ============================================================
      # EXPORT OPTIONS & IPA
      # ============================================================
      - name: Créer ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>
              </dict>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Exporter IPA
        run: |
          set -o pipefail

          echo "======================================"
          echo "EXPORT IPA"
          echo "======================================"

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa 2>&1 | tee /tmp/xcodebuild-export.log
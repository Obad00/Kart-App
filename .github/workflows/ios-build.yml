name: Build & Deploy iOS App

on:
  push:
    branches:
      - main
      - release/flutter
      - payment

jobs:
  build:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.kartapp.app
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL PYTHON DEPENDENCIES
      # ============================================================
      - name: Installer les dépendances Python Apple API
        run: |
          python3 -m pip install PyJWT cryptography --break-system-packages

      # ============================================================
      # 3. PREPARER LA CLE API APPLE
      # ============================================================
      - name: Préparer la clé App Store Connect
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -e

          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s' "$KEY_CONTENT" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          echo "✅ Clé API Apple préparée."

      # ============================================================
      # 4. ACTIVER PUSH NOTIFICATIONS AUTOMATIQUEMENT
      # ============================================================
      - name: Activer automatiquement Push Notifications
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -e

          python3 <<'PYEOF'
          import jwt
          import time
          import json
          import urllib.request
          import urllib.error
          import os
          import sys

          KEY_ID = os.environ["KEY_ID"]
          ISSUER_ID = os.environ["ISSUER_ID"]
          BUNDLE_ID = os.environ["BUNDLE_ID"]

          KEY_PATH = os.path.expanduser(
              f"~/.appstoreconnect/private_keys/AuthKey_{KEY_ID}.p8"
          )

          with open(KEY_PATH, "r") as f:
              PRIVATE_KEY = f.read()

          def make_token():
              now = int(time.time())

              payload = {
                  "iss": ISSUER_ID,
                  "iat": now,
                  "exp": now + 1200,
                  "aud": "appstoreconnect-v1"
              }

              return jwt.encode(
                  payload,
                  PRIVATE_KEY,
                  algorithm="ES256",
                  headers={
                      "kid": KEY_ID,
                      "typ": "JWT"
                  }
              )

          def api_request(url, method="GET", data=None):
              token = make_token()

              headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }

              body = None

              if data is not None:
                  body = json.dumps(data).encode("utf-8")

              request = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method
              )

              try:
                  with urllib.request.urlopen(request) as response:
                      content = response.read().decode("utf-8")

                      if not content:
                          return {}

                      return json.loads(content)

              except urllib.error.HTTPError as e:
                  error_body = e.read().decode("utf-8", errors="replace")

                  print(f"::error::Apple API HTTP {e.code}")
                  print(error_body)

                  raise

          # --------------------------------------------------------
          # 1. Trouver le Bundle ID
          # --------------------------------------------------------
          print(f"🔎 Recherche du Bundle ID : {BUNDLE_ID}")

          url = (
              "https://api.appstoreconnect.apple.com/v1/bundleIds"
              f"?filter[identifier]={BUNDLE_ID}"
          )

          bundle_data = api_request(url)

          if not bundle_data.get("data"):
              print(
                  f"::error::Le Bundle ID {BUNDLE_ID} "
                  "n'existe pas sur Apple Developer."
              )
              sys.exit(1)

          bundle = bundle_data["data"][0]

          bundle_resource_id = bundle["id"]

          print(
              f"✅ Bundle ID trouvé : "
              f"{BUNDLE_ID} ({bundle_resource_id})"
          )

          # --------------------------------------------------------
          # 2. Lire les capabilities actuelles
          # --------------------------------------------------------
          capabilities_url = (
              "https://api.appstoreconnect.apple.com/v1/"
              f"bundleIds/{bundle_resource_id}/bundleIdCapabilities"
          )

          capabilities_data = api_request(capabilities_url)

          capabilities = capabilities_data.get("data", [])

          capability_types = [
              capability["attributes"]["capabilityType"]
              for capability in capabilities
          ]

          print(
              f"Capabilities actuelles sur {BUNDLE_ID}: "
              f"{capability_types}"
          )

          # --------------------------------------------------------
          # 3. Vérifier Push Notifications
          # --------------------------------------------------------
          if "PUSH_NOTIFICATIONS" in capability_types:

              print(
                  "✅ Push Notifications est déjà activé."
              )

          else:

              print(
                  "⚠️ Push Notifications n'est pas activé."
              )

              print(
                  "🚀 Activation automatique via "
                  "App Store Connect API..."
              )

              payload = {
                  "data": {
                      "type": "bundleIdCapabilities",

                      "attributes": {
                          "capabilityType": "PUSH_NOTIFICATIONS"
                      },

                      "relationships": {
                          "bundleId": {
                              "data": {
                                  "type": "bundleIds",
                                  "id": bundle_resource_id
                              }
                          }
                      }
                  }
              }

              create_url = (
                  "https://api.appstoreconnect.apple.com/v1/"
                  "bundleIdCapabilities"
              )

              result = api_request(
                  create_url,
                  method="POST",
                  data=payload
              )

              created_capability = (
                  result.get("data", {})
                  .get("attributes", {})
                  .get("capabilityType")
              )

              if created_capability != "PUSH_NOTIFICATIONS":

                  print(
                      "::error::Apple n'a pas confirmé "
                      "l'activation de Push Notifications."
                  )

                  print(
                      json.dumps(
                          result,
                          indent=2
                      )
                  )

                  sys.exit(1)

              print(
                  "✅ Push Notifications activé avec succès."
              )

          # --------------------------------------------------------
          # 4. Vérification finale
          # --------------------------------------------------------
          print(
              "🔍 Vérification finale de Push Notifications..."
          )

          capabilities_data = api_request(
              capabilities_url
          )

          capability_types = [
              capability["attributes"]["capabilityType"]
              for capability in capabilities_data.get("data", [])
          ]

          print(
              f"Capabilities finales : {capability_types}"
          )

          if "PUSH_NOTIFICATIONS" not in capability_types:

              print(
                  "::error::Push Notifications "
                  "n'est toujours pas active."
              )

              sys.exit(1)

          print(
              "🎉 Push Notifications est bien activé sur "
              f"{BUNDLE_ID}."
          )

          PYEOF

      # ============================================================
      # 5. XCODE
      # ============================================================
      - name: Sélectionner Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Vérifier Xcode et SDK
        run: |
          set -e

          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcode-select --print-path
          xcodebuild -version

          echo ""
          echo "======================================"
          echo "iOS SDK"
          echo "======================================"

          xcrun --sdk iphoneos --show-sdk-version

      # ============================================================
      # 6. FLUTTER
      # ============================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64

      - name: Vérifier Flutter
        run: |
          flutter --version
          dart --version

      - name: Flutter precache iOS
        run: |
          flutter precache --ios

      # ============================================================
      # 7. DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        run: |
          flutter pub get

      # ============================================================
      # 8. CALCULER LA VERSION
      # ============================================================
      - name: Calculer la version
        run: |
          set -e

          BASE_VERSION=$(grep '^version:' pubspec.yaml \
            | sed 's/version: //' \
            | cut -d'+' -f1)

          MAJOR=$(echo "$BASE_VERSION" | cut -d'.' -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f2)

          BUILD_NAME="${MAJOR}.${MINOR}.${GITHUB_RUN_NUMBER}"

          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"

          echo "Version de base : $BASE_VERSION"
          echo "Version finale  : $BUILD_NAME"
          echo "Build number    : $GITHUB_RUN_NUMBER"

      # ============================================================
      # 9. PREPARER LES ENTITLEMENTS PUSH
      # ============================================================
      - name: Préparer les entitlements iOS
        run: |
          set -e

          mkdir -p ios/Runner

          cat > ios/Runner/Runner.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>development</string>
          </dict>
          </plist>
          EOF

          echo "✅ Runner.entitlements créé."

          cat ios/Runner/Runner.entitlements

      # ============================================================
      # 10. PREPARER FLUTTER / IOS
      # ============================================================
      - name: Générer les fichiers iOS
        run: |
          set -e

          echo "DEVELOPMENT_TEAM = $TEAM_ID" \
            >> ios/Flutter/Release.xcconfig

          echo "DEVELOPMENT_TEAM = $TEAM_ID" \
            >> ios/Flutter/Debug.xcconfig

          flutter build ios \
            --release \
            --no-codesign \
            --no-pub \
            --build-number="$GITHUB_RUN_NUMBER" \
            --build-name="$BUILD_NAME"

      # ============================================================
      # 11. PODS
      # ============================================================
      - name: Install Pods
        run: |
          set -e

          cd ios

          pod install --repo-update

      # ============================================================
      # 12. VERIFIER LE BUNDLE ID
      # ============================================================
      - name: Vérifier Bundle ID iOS
        run: |
          set -e

          echo "Recherche du Bundle Identifier..."

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -showBuildSettings \
            | grep -E "PRODUCT_BUNDLE_IDENTIFIER|DEVELOPMENT_TEAM" \
            || true

      # ============================================================
      # 13. ARCHIVE AVEC SIGNING AUTOMATIQUE
      # ============================================================
      - name: Archiver avec signature automatique
        run: |
          set -e

          echo "======================================"
          echo "ARCHIVE IOS"
          echo "======================================"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS="Runner/Runner.entitlements" \
            archive

      # ============================================================
      # 14. EXPORT OPTIONS
      # ============================================================
      - name: Créer ExportOptions.plist
        run: |
          set -e

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
           "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>destination</key>
              <string>export</string>

              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>automatic</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>uploadSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          cat ios/ExportOptions.plist

      # ============================================================
      # 15. EXPORT IPA
      # ============================================================
      - name: Exporter le IPA
        run: |
          set -e

          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/build/ios/archive/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/build/ios/ipa" \
            -exportOptionsPlist "$GITHUB_WORKSPACE/ios/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      # ============================================================
      # 16. VERIFIER IPA
      # ============================================================
      - name: Vérifier le IPA et les Push Entitlements
        run: |
          set -e

          IPA_PATH=$(find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "::error::Aucun fichier IPA trouvé."
            exit 1
          fi

          echo "IPA trouvé : $IPA_PATH"

          rm -rf /tmp/ipa_check

          mkdir -p /tmp/ipa_check

          unzip -q "$IPA_PATH" \
            -d /tmp/ipa_check

          APP_PATH=$(find /tmp/ipa_check/Payload \
            -maxdepth 1 \
            -name "*.app" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "::error::Application .app introuvable dans le IPA."
            exit 1
          fi

          echo "Application : $APP_PATH"

          # --------------------------------------------------------
          # Lire le profil de provisioning
          # --------------------------------------------------------
          if [ -f "$APP_PATH/embedded.mobileprovision" ]; then

            echo ""
            echo "======================================"
            echo "PROVISIONING PROFILE"
            echo "======================================"

            security cms \
              -D \
              -i "$APP_PATH/embedded.mobileprovision" \
              > /tmp/profile.plist

            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements" \
              /tmp/profile.plist \
              || true

          else

            echo "::warning::embedded.mobileprovision introuvable."

          fi

          # --------------------------------------------------------
          # Lire les entitlements du binaire
          # --------------------------------------------------------
          echo ""
          echo "======================================"
          echo "BINARY ENTITLEMENTS"
          echo "======================================"

          codesign \
            -d \
            --entitlements :- \
            "$APP_PATH" \
            > /tmp/entitlements.plist \
            2>/tmp/codesign_error.txt || true

          cat /tmp/entitlements.plist || true

          # --------------------------------------------------------
          # Vérifier aps-environment
          # --------------------------------------------------------
          APS_ENV=$(
            /usr/libexec/PlistBuddy \
              -c "Print :aps-environment" \
              /tmp/entitlements.plist \
              2>/dev/null \
              || echo "MISSING"
          )

          echo ""
          echo "======================================"
          echo "APNS"
          echo "======================================"

          echo "aps-environment = $APS_ENV"

          if [ "$APS_ENV" != "production" ]; then

            echo "::error::aps-environment doit être production."
            echo "::error::Valeur actuelle : $APS_ENV"

            echo ""
            echo "Erreur codesign :"
            cat /tmp/codesign_error.txt || true

            exit 1

          fi

          echo "✅ aps-environment=production"

      # ============================================================
      # 17. VERIFIER BUNDLE ID DU IPA
      # ============================================================
      - name: Vérifier Bundle ID du IPA
        run: |
          set -e

          IPA_PATH=$(find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            | head -1)

          rm -rf /tmp/bundle_check

          mkdir -p /tmp/bundle_check

          unzip -q "$IPA_PATH" \
            -d /tmp/bundle_check

          APP_PATH=$(find /tmp/bundle_check/Payload \
            -maxdepth 1 \
            -name "*.app" \
            | head -1)

          ACTUAL_BUNDLE_ID=$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleIdentifier" \
              "$APP_PATH/Info.plist"
          )

          echo "Bundle ID attendu : $BUNDLE_ID"
          echo "Bundle ID trouvé  : $ACTUAL_BUNDLE_ID"

          if [ "$ACTUAL_BUNDLE_ID" != "$BUNDLE_ID" ]; then

            echo "::error::Le Bundle ID ne correspond pas."

            exit 1

          fi

          echo "✅ Bundle ID correct."

      # ============================================================
      # 18. ARTIFACT
      # ============================================================
      - name: Sauvegarder le fichier IPA
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-iOS
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      # ============================================================
      # 19. UPLOAD APP STORE CONNECT
      # ============================================================
      - name: Soumettre à App Store Connect
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/flutter'
        run: |
          set -e

          IPA_PATH=$(find build/ios/ipa \
            -name "*.ipa" \
            | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA introuvable."
            exit 1
          fi

          echo "======================================"
          echo "UPLOAD APP STORE CONNECT"
          echo "======================================"

          echo "IPA : $IPA_PATH"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose

      # ============================================================
      # 20. CLEANUP
      # ============================================================
      - name: Nettoyage
        if: always()
        run: |
          rm -f \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            || true

          rm -rf \
            /tmp/ipa_check \
            /tmp/bundle_check \
            || true

          echo "✅ Nettoyage terminé."
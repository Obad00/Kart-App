name: Build & Deploy iOS App

on:
  push:
    branches: [main, release/flutter, payment]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Vérifier que Push Notifications est activé sur l'App ID
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          BUNDLE_ID: com.kartapp.app
        run: |
          pip3 install PyJWT cryptography --break-system-packages

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          python3 - <<'PYEOF'
          import jwt, time, json, urllib.request, os

          key_id = os.environ['KEY_ID']
          issuer_id = os.environ['ISSUER_ID']
          bundle_id = os.environ['BUNDLE_ID']
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")

          with open(key_path) as f:
              private_key = f.read()

          def make_token():
              payload = {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1"
              }
              return jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})

          def api_request(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {make_token()}"})
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # 1. Résoudre l'App ID
          bundle_data = api_request(f"https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]={bundle_id}")
          if not bundle_data["data"]:
              print(f"::error::Bundle ID {bundle_id} introuvable sur le portail Apple Developer.")
              exit(1)
          bundle_resource_id = bundle_data["data"][0]["id"]

          # 2. Lister ses capabilities
          caps_data = api_request(f"https://api.appstoreconnect.apple.com/v1/bundleIds/{bundle_resource_id}/bundleIdCapabilities")
          capability_types = [c["attributes"]["capabilityType"] for c in caps_data.get("data", [])]

          print(f"Capabilities actuelles sur {bundle_id}: {capability_types}")

          if "PUSH_NOTIFICATIONS" not in capability_types:
              print(f"::error::La capability Push Notifications n'est PAS activée sur l'App ID {bundle_id}. "
                    f"Va sur https://developer.apple.com/account/resources/identifiers/list, sélectionne "
                    f"{bundle_id}, coche Push Notifications, puis relance le workflow. "
                    f"Sans ça, le profil de provisionnement généré par ce pipeline ne contiendra jamais "
                    f"l'entitlement aps-environment.")
              exit(1)
          else:
              print("✅ Push Notifications est bien activé sur l'App ID.")
          PYEOF

      - name: Sélectionner Xcode latest
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "latest-stable"

      - name: Vérifier la version Xcode & SDK
        run: |
          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: arm64

      - name: Flutter precache iOS
        run: flutter precache --ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Calculer la version marketing (toujours strictement croissante)
        # App Store refuse tout nouvel envoi dont la version marketing
        # (CFBundleShortVersionString) n'est pas strictement supérieure à la
        # dernière version APPROUVÉE — un simple build number croissant ne
        # suffit pas. Pour ne plus jamais avoir à bumper pubspec.yaml à la
        # main avant chaque soumission, on garde MAJOR.MINOR défini dans
        # pubspec.yaml (pour les vraies montées de version), mais le PATCH
        # est toujours le run number du workflow — strictement croissant à
        # chaque exécution, par construction GitHub Actions.
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f1,2)
          echo "BUILD_NAME=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Générer les fichiers iOS (plugins registrant)
        run: |
          echo "DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}" >> ios/Flutter/Debug.xcconfig
          flutter build ios --release --no-codesign --no-pub --build-number=${{ github.run_number }} --build-name=$BUILD_NAME

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Nettoyer les vieux certificats de développement via API
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          pip3 install PyJWT cryptography --break-system-packages

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          python3 - <<'PYEOF'
          import jwt, time, json, urllib.request, os

          key_id = os.environ['KEY_ID']
          issuer_id = os.environ['ISSUER_ID']
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")

          with open(key_path) as f:
              private_key = f.read()

          def make_token():
              payload = {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1"
              }
              return jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})

          headers = {
              "Authorization": f"Bearer {make_token()}",
              "Content-Type": "application/json"
          }

          url = "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=IOS_DEVELOPMENT&limit=20"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())

          certs = data.get("data", [])
          print(f"Certificats de développement trouvés: {len(certs)}")

          certs_sorted = sorted(certs, key=lambda c: c["attributes"]["expirationDate"], reverse=True)
          to_delete = certs_sorted[1:]

          for cert in to_delete:
              cert_id = cert["id"]
              name = cert["attributes"]["name"]
              print(f"Suppression: {name} ({cert_id})")
              del_req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/certificates/{cert_id}",
                  headers={"Authorization": f"Bearer {make_token()}"},
                  method="DELETE"
              )
              try:
                  urllib.request.urlopen(del_req)
                  print(f"  -> Supprimé")
              except Exception as e:
                  print(f"  -> Erreur: {e}")

          print("Nettoyage des certificats de développement terminé")
          PYEOF

      - name: Gérer Certificat Distribution et Générer Profil
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          BUNDLE_ID: com.kartapp.app
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          python3 - <<'PYEOF'
          import jwt, time, json, urllib.request, base64, os

          key_id = os.environ['KEY_ID']
          issuer_id = os.environ['ISSUER_ID']
          bundle_id = os.environ['BUNDLE_ID']
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")

          with open(key_path) as f:
              private_key = f.read()

          def make_token():
              payload = {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1"
              }
              return jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})

          def api_request(url, data=None, method=None):
              headers = {
                  "Authorization": f"Bearer {make_token()}",
                  "Content-Type": "application/json"
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode() if data else None,
                  headers=headers,
                  method=method or ("POST" if data else "GET")
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f"::error::Apple API a renvoyé {e.code} pour {method or ('POST' if data else 'GET')} {url}")
                  print(f"::error::Détail: {body}")
                  raise

          # 1. Révocation des certificats de Distribution existants, puis création d'un nouveau.
          # IMPORTANT : l'API App Store Connect ne renvoie JAMAIS la clé privée d'un
          # certificat existant (raison de sécurité) — seul le certificat public. Un
          # runner GitHub Actions est une machine neuve à chaque run : la clé privée
          # d'un certificat créé lors d'un run précédent n'existe nulle part dessus.
          # "Réutiliser" un certificat trouvé via l'API est donc inutilisable pour
          # signer, sauf à sauvegarder sa clé privée ailleurs (ex: secret .p12), ce
          # qu'on ne fait pas ici. On révoque donc systématiquement l'existant pour
          # libérer le quota Apple (2-3 certificats Distribution actifs max par
          # compte, partagé entre les types DISTRIBUTION et IOS_DISTRIBUTION) et on
          # génère un nouveau certificat dont on possède la clé privée localement.
          print("Recherche des certificats de Distribution existants (DISTRIBUTION ou IOS_DISTRIBUTION)...")
          existing_certs = api_request("https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DISTRIBUTION,IOS_DISTRIBUTION&limit=20")

          for cert in existing_certs.get("data", []):
              old_cert_id = cert["id"]
              old_name = cert["attributes"].get("name", old_cert_id)
              print(f"Révocation du certificat existant (clé privée non récupérable): {old_name} ({old_cert_id})")
              try:
                  api_request(f"https://api.appstoreconnect.apple.com/v1/certificates/{old_cert_id}", method="DELETE")
              except Exception as e:
                  print(f"  -> Erreur lors de la révocation (ignorée): {e}")

          print("Génération d'un nouveau certificat de Distribution avec clé privée locale...")
          os.system("openssl genrsa -out /tmp/distribution.key 2048")
          os.system('openssl req -new -key /tmp/distribution.key -out /tmp/distribution.csr -subj "/CN=Apple Distribution/O=KartApp/C=US"')

          with open("/tmp/distribution.csr", "rb") as f:
              csr_content = base64.b64encode(f.read()).decode()

          cert_data = api_request(
              "https://api.appstoreconnect.apple.com/v1/certificates",
              data={
                  "data": {
                      "type": "certificates",
                      "attributes": {
                          # "DISTRIBUTION" = type unifié "Apple Distribution",
                          # cohérent avec CODE_SIGN_IDENTITY="Apple Distribution"
                          # utilisé dans l'étape d'archive plus bas.
                          "certificateType": "DISTRIBUTION",
                          "csrContent": csr_content
                      }
                  }
              }
          )
          cert_content = cert_data["data"]["attributes"]["certificateContent"]
          cert_id = cert_data["data"]["id"]
          print(f"✅ Nouveau certificat créé : {cert_id}")

          with open("/tmp/distribution.cer", "wb") as f:
              f.write(base64.b64decode(cert_content))

          # 2. Bundle ID Resource Lookup
          bundle_data = api_request(f"https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]={bundle_id}")
          if not bundle_data["data"]:
              raise Exception(f"Bundle ID {bundle_id} non trouvé")
          bundle_resource_id = bundle_data["data"][0]["id"]

          # 3. Nettoyage des anciens profils
          profiles_data = api_request("https://api.appstoreconnect.apple.com/v1/profiles?filter[profileType]=IOS_APP_STORE&limit=20")
          for profile in profiles_data.get("data", []):
              if "KartApp" in profile["attributes"]["name"]:
                  try:
                      api_request(f"https://api.appstoreconnect.apple.com/v1/profiles/{profile['id']}", method="DELETE")
                  except:
                      pass

          # 4. Génération du profil de provisionnement
          profile_data = api_request(
              "https://api.appstoreconnect.apple.com/v1/profiles",
              data={
                  "data": {
                      "type": "profiles",
                      "attributes": {
                          "name": f"KartApp AppStore CI {int(time.time())}",
                          "profileType": "IOS_APP_STORE"
                      },
                      "relationships": {
                          "bundleId": {
                              "data": {"type": "bundleIds", "id": bundle_resource_id}
                          },
                          "certificates": {
                              "data": [{"type": "certificates", "id": cert_id}]
                          }
                      }
                  }
              }
          )

          profile_content = profile_data["data"]["attributes"]["profileContent"]
          profile_uuid = profile_data["data"]["attributes"]["uuid"]

          with open("/tmp/profile.mobileprovision", "wb") as f:
              f.write(base64.b64decode(profile_content))

          with open("/tmp/profile_uuid.txt", "w") as f:
              f.write(profile_uuid)

          print(f"🚀 Profil créé - UUID: {profile_uuid}")
          PYEOF

          # Import du certificat + clé privée (toujours généré localement à cette étape,
          # voir le commentaire dans le bloc Python ci-dessus)
          openssl x509 -inform DER -in /tmp/distribution.cer -out /tmp/distribution.pem
          openssl pkcs12 -export -inkey /tmp/distribution.key -in /tmp/distribution.pem -out /tmp/distribution.p12 -passout pass:tempci123 -legacy 2>/dev/null || \
          openssl pkcs12 -export -inkey /tmp/distribution.key -in /tmp/distribution.pem -out /tmp/distribution.p12 -passout pass:tempci123

          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "temppass" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temppass" "$KEYCHAIN_PATH"
          security import /tmp/distribution.p12 -k "$KEYCHAIN_PATH" -P "tempci123" -A -t cert -f pkcs12
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "temppass" "$KEYCHAIN_PATH"

          # Installer le profil sur le Mac virtuel
          PROFILE_UUID=$(cat /tmp/profile_uuid.txt)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV

      - name: Scoper la signature au target Runner (via xcconfig)
        run: |
          # CODE_SIGN_STYLE / CODE_SIGN_IDENTITY / PROVISIONING_PROFILE_SPECIFIER
          # ne doivent PAS être passés en override sur la ligne de commande
          # xcodebuild : un override en ligne de commande s'applique à TOUS les
          # targets du graphe de build (Runner + tous les pods CocoaPods + tous
          # les packages Swift Package Manager comme Firebase, GoogleUtilities,
          # etc.). Ces targets tiers sont des frameworks, pas des apps : ils ne
          # supportent pas la signature manuelle avec provisioning profile, et
          # l'archive échoue avec "XXX does not support provisioning profiles".
          #
          # Release.xcconfig, lui, n'est référencé QUE par la configuration
          # Release du target Runner dans Runner.xcodeproj — ces réglages ne
          # s'appliquent donc qu'à Runner, et les pods/packages tiers gardent
          # leur signature automatique par défaut, intacte.
          echo "CODE_SIGN_STYLE = Manual" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = Apple Distribution" >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_UUID" >> ios/Flutter/Release.xcconfig

      - name: Créer le fichier ExportOptions
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Archiver et Signer avec Xcodebuild
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # CODE_SIGNING_ALLOWED doit être YES (le défaut, on ne le désactive donc
          # plus) pendant l'archive : c'est à ce moment-là que Xcode lit
          # CODE_SIGN_ENTITLEMENTS (Runner.entitlements) et enregistre les
          # entitlements custom (aps-environment, keychain-access-groups, etc.)
          # dans l'archive. Si la signature est désactivée ici, ces entitlements
          # ne sont jamais capturés, et -exportArchive (même en
          # signingStyle=automatic) ne peut pas les "retrouver" plus tard — il ne
          # fait que re-signer avec le strict minimum.
          #
          # Les réglages de signature (CODE_SIGN_STYLE, CODE_SIGN_IDENTITY,
          # PROVISIONING_PROFILE_SPECIFIER, DEVELOPMENT_TEAM) ne sont PAS passés
          # ici en overrides de ligne de commande : ils sont déjà dans
          # ios/Flutter/Release.xcconfig, où ils ne s'appliquent qu'au target
          # Runner (voir l'étape précédente) au lieu de s'appliquer globalement
          # à tous les pods/packages tiers du build.
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=YES \
            archive 2>&1 | tee /tmp/xcodebuild.log; \
          EXIT_CODE=${PIPESTATUS[0]}; \
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== DETECTED XCODEBUILD ERRORS ==="
            grep -E "error:|failed" /tmp/xcodebuild.log | head -50
            exit $EXIT_CODE
          fi

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

      - name: Vérifier l'entitlement aps-environment (notifications push)
        run: |
          # C'est le .ipa produit par -exportArchive (étape précédente) qui
          # contient la signature et les entitlements finaux — c'est donc lui
          # qu'il faut inspecter, pas l'archive .xcarchive intermédiaire.
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Aucun .ipa trouvé dans build/ios/ipa — impossible de vérifier l'entitlement."
            exit 1
          fi

          rm -rf /tmp/ipa_check && mkdir -p /tmp/ipa_check
          unzip -q "$IPA_PATH" -d /tmp/ipa_check
          APP_PATH=$(find /tmp/ipa_check/Payload -maxdepth 1 -name "*.app" | head -1)

          # Diagnostic : ce que le PROFIL DE PROVISIONNEMENT lui-même autorise
          # (source de vérité côté Apple — indépendant de ce que Xcode a fait
          # ensuite lors de la signature/export). Émis en ::notice:: (pas en
          # simple echo) car les logs bruts de ce step ne sont pas lisibles
          # depuis l'extérieur du dépôt — seules les annotations le sont.
          if [ -f "$APP_PATH/embedded.mobileprovision" ]; then
            security cms -D -i "$APP_PATH/embedded.mobileprovision" > /tmp/profile.plist 2>/dev/null
            echo "::notice::PROFIL — entitlements accordés :"
            /usr/libexec/PlistBuddy -c "Print :Entitlements" /tmp/profile.plist 2>/tmp/profile_err.txt \
              | while IFS= read -r line; do echo "::notice::PROFIL: $line"; done
            if [ -s /tmp/profile_err.txt ]; then
              echo "::notice::PROFIL: (lecture impossible) $(cat /tmp/profile_err.txt)"
            fi
          else
            echo "::notice::PROFIL: aucun embedded.mobileprovision trouvé dans $APP_PATH"
          fi

          codesign -d --entitlements :- "$APP_PATH" > /tmp/entitlements.plist 2>/tmp/codesign_err.txt
          echo "::notice::BINAIRE — entitlements réellement signés :"
          if [ -s /tmp/entitlements.plist ]; then
            /usr/libexec/PlistBuddy -c "Print" /tmp/entitlements.plist 2>/dev/null \
              | while IFS= read -r line; do echo "::notice::BINAIRE: $line"; done
          else
            echo "::notice::BINAIRE: (vide) $(cat /tmp/codesign_err.txt)"
          fi

          APS_ENV=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" /tmp/entitlements.plist 2>/dev/null || echo "MISSING")
          echo "::notice::aps-environment signé dans le .ipa exporté : $APS_ENV"
          if [ "$APS_ENV" != "production" ]; then
            echo "::error::aps-environment devrait être 'production' pour un build App Store Connect, trouvé: '$APS_ENV'. Les notifications push ne seront pas délivrées par Firebase tant que ce n'est pas corrigé."
            exit 1
          fi

      - name: Sauvegarder le fichier IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-iOS
          path: build/ios/ipa/*.ipa

      - name: Soumettre à l'App Store Connect
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/flutter'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading targeting path: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose

      - name: Nettoyer le trousseau temporaire (Keychain Clean)
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
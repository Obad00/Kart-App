name: Build & Deploy iOS App

on:
  push:
    branches: [main, payment]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sélectionner Xcode latest
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Vérifier la version Xcode & SDK
        run: |
          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: arm64

      - name: Flutter precache iOS
        run: flutter precache --ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Générer les fichiers iOS (plugins registrant)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Désactiver le signing sur les Pods (patch Ruby)
        run: |
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Pods/Pods.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED']       = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED']      = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY']         = ''
              config.build_settings['CODE_SIGN_STYLE']            = 'Manual'
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
            end
          end
          project.save
          puts "Pods signing patched successfully"
          RUBY

      - name: Nettoyer les vieux certificats de développement via API
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          pip3 install PyJWT cryptography --break-system-packages

          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          python3 - <<'PYEOF'
          import jwt, time, json, urllib.request, os

          key_id = os.environ['KEY_ID']
          issuer_id = os.environ['ISSUER_ID']
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")

          with open(key_path) as f:
              private_key = f.read()

          def make_token():
              payload = {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1"
              }
              return jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})

          headers = {
              "Authorization": f"Bearer {make_token()}",
              "Content-Type": "application/json"
          }

          # Lister tous les certificats IOS_DEVELOPMENT créés via API
          url = "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=IOS_DEVELOPMENT&limit=20"
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read())

          certs = data.get("data", [])
          print(f"Certificats de développement trouvés: {len(certs)}")

          # Supprimer tous sauf le plus récent
          certs_sorted = sorted(certs, key=lambda c: c["attributes"]["expirationDate"], reverse=True)
          to_delete = certs_sorted[1:]  # garder le plus récent

          for cert in to_delete:
              cert_id = cert["id"]
              name = cert["attributes"]["name"]
              print(f"Suppression: {name} ({cert_id})")
              del_req = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com/v1/certificates/{cert_id}",
                  headers={"Authorization": f"Bearer {make_token()}"},
                  method="DELETE"
              )
              try:
                  urllib.request.urlopen(del_req)
                  print(f"  -> Supprimé")
              except Exception as e:
                  print(f"  -> Erreur: {e}")

          print("Nettoyage terminé")
          PYEOF

      - name: Générer certificat et profil via App Store Connect API
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          BUNDLE_ID: com.kartapp.app
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          # Générer une clé privée et CSR
          openssl genrsa -out /tmp/distribution.key 2048
          openssl req -new \
            -key /tmp/distribution.key \
            -out /tmp/distribution.csr \
            -subj "/CN=Apple Distribution/O=KartApp/C=US"

          python3 - <<'PYEOF'
          import jwt, time, json, urllib.request, base64, os

          key_id = os.environ['KEY_ID']
          issuer_id = os.environ['ISSUER_ID']
          bundle_id = os.environ['BUNDLE_ID']
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")

          with open(key_path) as f:
              private_key = f.read()

          def make_token():
              payload = {
                  "iss": issuer_id,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 1200,
                  "aud": "appstoreconnect-v1"
              }
              return jwt.encode(payload, private_key, algorithm="ES256", headers={"kid": key_id})

          def api_request(url, data=None, method=None):
              headers = {
                  "Authorization": f"Bearer {make_token()}",
                  "Content-Type": "application/json"
              }
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode() if data else None,
                  headers=headers,
                  method=method or ("POST" if data else "GET")
              )
              with urllib.request.urlopen(req) as resp:
                  return json.loads(resp.read())

          # Lire la CSR
          with open("/tmp/distribution.csr", "rb") as f:
              csr_content = base64.b64encode(f.read()).decode()

          # Créer le certificat IOS_DISTRIBUTION via API
          print("Création du certificat IOS_DISTRIBUTION...")
          cert_data = api_request(
              "https://api.appstoreconnect.apple.com/v1/certificates",
              data={
                  "data": {
                      "type": "certificates",
                      "attributes": {
                          "certificateType": "IOS_DISTRIBUTION",
                          "csrContent": csr_content
                      }
                  }
              }
          )

          cert_content = cert_data["data"]["attributes"]["certificateContent"]
          cert_id = cert_data["data"]["id"]
          cert_bytes = base64.b64decode(cert_content)

          with open("/tmp/distribution.cer", "wb") as f:
              f.write(cert_bytes)

          print(f"Certificat créé: {cert_id}")

          # Trouver le bundle ID resource
          print(f"Recherche du bundle ID: {bundle_id}...")
          bundle_data = api_request(
              f"https://api.appstoreconnect.apple.com/v1/bundleIds?filter[identifier]={bundle_id}"
          )

          if not bundle_data["data"]:
              raise Exception(f"Bundle ID {bundle_id} non trouvé dans App Store Connect")

          bundle_resource_id = bundle_data["data"][0]["id"]
          print(f"Bundle resource ID: {bundle_resource_id}")

          # Supprimer les anciens profils App Store pour éviter les conflits
          print("Nettoyage des anciens profils...")
          profiles_data = api_request(
              "https://api.appstoreconnect.apple.com/v1/profiles?filter[profileType]=IOS_APP_STORE&limit=20"
          )
          for profile in profiles_data.get("data", []):
              if "KartApp" in profile["attributes"]["name"]:
                  profile_id = profile["id"]
                  print(f"Suppression profil: {profile['attributes']['name']}")
                  headers = {
                      "Authorization": f"Bearer {make_token()}"
                  }
                  del_req = urllib.request.Request(
                      f"https://api.appstoreconnect.apple.com/v1/profiles/{profile_id}",
                      headers=headers,
                      method="DELETE"
                  )
                  try:
                      urllib.request.urlopen(del_req)
                  except:
                      pass

          # Créer un nouveau profil App Store
          print("Création du profil App Store...")
          profile_data = api_request(
              "https://api.appstoreconnect.apple.com/v1/profiles",
              data={
                  "data": {
                      "type": "profiles",
                      "attributes": {
                          "name": f"KartApp AppStore CI {int(time.time())}",
                          "profileType": "IOS_APP_STORE"
                      },
                      "relationships": {
                          "bundleId": {
                              "data": {"type": "bundleIds", "id": bundle_resource_id}
                          },
                          "certificates": {
                              "data": [{"type": "certificates", "id": cert_id}]
                          }
                      }
                  }
              }
          )

          profile_content = profile_data["data"]["attributes"]["profileContent"]
          profile_uuid = profile_data["data"]["attributes"]["uuid"]
          profile_bytes = base64.b64decode(profile_content)

          with open("/tmp/profile.mobileprovision", "wb") as f:
              f.write(profile_bytes)

          with open("/tmp/profile_uuid.txt", "w") as f:
              f.write(profile_uuid)

          print(f"Profil créé - UUID: {profile_uuid}")
          PYEOF

          # Convertir .cer + clé privée en .p12
          openssl x509 -inform DER -in /tmp/distribution.cer -out /tmp/distribution.pem
          openssl pkcs12 -export \
            -inkey /tmp/distribution.key \
            -in /tmp/distribution.pem \
            -out /tmp/distribution.p12 \
            -passout pass:tempci123 \
            -legacy 2>/dev/null || \
          openssl pkcs12 -export \
            -inkey /tmp/distribution.key \
            -in /tmp/distribution.pem \
            -out /tmp/distribution.p12 \
            -passout pass:tempci123

          # Installer dans le keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "temppass" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temppass" "$KEYCHAIN_PATH"
          security import /tmp/distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "tempci123" \
            -A -t cert -f pkcs12
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "temppass" "$KEYCHAIN_PATH"

          # Installer le profil
          PROFILE_UUID=$(cat /tmp/profile_uuid.txt)
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$PROFILE_UUID.mobileprovision

          echo "PROFILE_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          echo "Profil installé: $PROFILE_UUID"

      - name: Créer le fichier ExportOptions
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.kartapp.app</key>
                  <string>${{ env.PROFILE_UUID }}</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Archiver et Signer avec Xcodebuild
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive 2>&1 | tee /tmp/xcodebuild.log; \
          EXIT_CODE=${PIPESTATUS[0]}; \
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== ERREURS XCODEBUILD ==="
            grep -E "error:|failed" /tmp/xcodebuild.log | head -50
            exit $EXIT_CODE
          fi

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Sauvegarder le fichier IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-iOS
          path: build/ios/ipa/*.ipa

      - name: Soumettre à l'App Store Connect
        if: github.ref == 'refs/heads/main'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose

      - name: Nettoyer le keychain temporaire
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
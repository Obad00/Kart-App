name: Build & Deploy iOS App

on:
  push:
    branches: [main, payment]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sélectionner Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Vérifier la version Xcode & SDK
        run: |
          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: arm64

      - name: Flutter precache iOS
        run: flutter precache --ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Générer les fichiers iOS (plugins registrant)
        run: flutter build ios --release --no-codesign --no-pub

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Désactiver le signing sur les Pods (patch Ruby)
        run: |
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Pods/Pods.xcodeproj')
          project.targets.each do |target|
            target.build_configurations.each do |config|
              config.build_settings['CODE_SIGNING_ALLOWED']       = 'NO'
              config.build_settings['CODE_SIGNING_REQUIRED']      = 'NO'
              config.build_settings['CODE_SIGN_IDENTITY']         = ''
              config.build_settings['CODE_SIGN_STYLE']            = 'Manual'
              config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
            end
          end
          project.save
          puts "Pods signing patched successfully"
          RUBY

      - name: Nettoyer les certificats Apple en surnombre
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          ruby - <<'RUBY'
          require 'jwt'
          require 'net/http'
          require 'json'
          require 'openssl'

          # 1. Génération du JWT pour l'API App Store Connect
          private_key = OpenSSL::PKey::EC.new(ENV['KEY_CONTENT'])
          payload = {
            iss: ENV['ISSUER_ID'],
            iat: Time.now.to_i,
            exp: Time.now.to_i + (10 * 60),
            aud: 'appstoreconnect-v1'
          }
          header = { kid: ENV['KEY_ID'], typ: 'JWT' }
          token = JWT.encode(payload, private_key, 'ES256', header)

          # 2. Requête vers l'API pour l'inventaire des certificats
          uri = URI('https://api.appstoreconnect.apple.com/v1/certificates?limit=10')
          req = Net::HTTP::Get.new(uri)
          req['Authorization'] = "Bearer #{token}"
          req['Content-Type'] = 'application/json'

          res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
          data = JSON.parse(res.body)

          if data['data'] && !data['data'].empty?
            # Cibler en priorité les certificats génériques ("Mac", "Runner" ou vides)
            certs_to_revoke = data['data'].select do |c| 
              display_name = c['attributes']['displayName'] || ""
              display_name.include?("Mac") || display_name.include?("Runner") || display_name.empty?
            end

            if certs_to_revoke.empty?
              # Si aucun certificat générique flagrant, on prend le plus ancien pour libérer une place
              certs_to_revoke = [data['data'].last]
            end

            certs_to_revoke.each do |cert|
              id = cert['id']
              name = cert['attributes']['name']
              puts "ℹ️ Nettoyage programmé : Révocation du certificat #{name} (ID: #{id})"
              
              del_uri = URI("https://api.appstoreconnect.apple.com/v1/certificates/#{id}")
              del_req = Net::HTTP::Delete.new(del_uri)
              del_req['Authorization'] = "Bearer #{token}"
              
              Net::HTTP.start(del_uri.hostname, del_uri.port, use_ssl: true) { |http| http.request(del_req) }
              puts "✅ Certificat #{id} révoqué avec succès."
            end
          else
            puts "✅ Aucun certificat encombrant détecté sur le compte."
          end
          RUBY

      - name: Créer le fichier ExportOptions
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Archiver et Signer avec Xcodebuild
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Automatic" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8" \
            archive

          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"

      - name: Sauvegarder le fichier IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-iOS
          path: build/ios/ipa/*.ipa

      - name: Soumettre à l'App Store Connect
        if: github.ref == 'refs/heads/main'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose
name: Build & Deploy iOS App

on:
  push:
    branches:
      - main
      - release/flutter
      - payment

jobs:
  build:
    runs-on: macos-15

    env:
      BUNDLE_ID: com.kartapp.app
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # XCODE
      # ============================================================
      - name: Sélectionner Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Vérifier Xcode
        run: |
          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcode-select --print-path
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version


      # ============================================================
      # PYTHON / APP STORE CONNECT API
      # ============================================================
      - name: Installer les dépendances API Apple
        run: |
          pip3 install PyJWT cryptography --break-system-packages


      # ============================================================
      # CRÉER LA CLÉ APP STORE CONNECT
      # ============================================================
      - name: Configurer App Store Connect API
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -e

          mkdir -p "$HOME/.appstoreconnect/private_keys"

          printf '%s' "$KEY_CONTENT" \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          chmod 600 \
            "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

          echo "Clé App Store Connect configurée."


      # ============================================================
      # VÉRIFIER BUNDLE ID + PUSH NOTIFICATIONS
      # ============================================================
      - name: Vérifier Push Notifications
        run: |
          set -e

          python3 <<'PYEOF'
          import jwt
          import time
          import json
          import urllib.request
          import urllib.parse
          import os
          import sys

          key_id = os.environ["KEY_ID"]
          issuer_id = os.environ["ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]

          key_path = os.path.expanduser(
              f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8"
          )

          with open(key_path, "r") as f:
              private_key = f.read()

          def make_token():
              now = int(time.time())

              payload = {
                  "iss": issuer_id,
                  "iat": now,
                  "exp": now + 1200,
                  "aud": "appstoreconnect-v1"
              }

              return jwt.encode(
                  payload,
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id}
              )

          def api_request(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {make_token()}",
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read())

          print("======================================")
          print("APPLE APP ID")
          print("======================================")

          encoded_bundle = urllib.parse.quote(bundle_id, safe="")

          url = (
              "https://api.appstoreconnect.apple.com/v1/bundleIds"
              f"?filter[identifier]={encoded_bundle}"
          )

          bundle_data = api_request(url)

          if not bundle_data.get("data"):
              print(
                  f"::error::Bundle ID {bundle_id} introuvable."
              )
              sys.exit(1)

          bundle = bundle_data["data"][0]
          bundle_resource_id = bundle["id"]

          print(f"Bundle ID : {bundle_id}")
          print(f"Resource ID : {bundle_resource_id}")

          print("")
          print("======================================")
          print("CAPABILITIES")
          print("======================================")

          caps_url = (
              "https://api.appstoreconnect.apple.com/v1/bundleIds/"
              f"{bundle_resource_id}/bundleIdCapabilities"
          )

          caps_data = api_request(caps_url)

          capabilities = [
              item["attributes"]["capabilityType"]
              for item in caps_data.get("data", [])
          ]

          print("Capabilities :", capabilities)

          if "PUSH_NOTIFICATIONS" not in capabilities:
              print(
                  "::error::Push Notifications n'est pas activé "
                  f"sur {bundle_id}."
              )

              print(
                  "::error::Active Push Notifications dans "
                  "Apple Developer > Certificates, Identifiers & Profiles "
                  "> Identifiers."
              )

              sys.exit(1)

          print("✅ Push Notifications est activé.")

          PYEOF


      # ============================================================
      # FLUTTER
      # ============================================================
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          architecture: arm64

      - name: Vérifier Flutter
        run: |
          flutter --version
          dart --version


      # ============================================================
      # FLUTTER PRECACHE
      # ============================================================
      - name: Flutter precache iOS
        run: |
          flutter precache --ios


      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Installer les dépendances Flutter
        run: |
          flutter pub get


      # ============================================================
      # VERSION
      # ============================================================
      - name: Calculer la version
        run: |
          set -e

          BASE_VERSION=$(grep '^version:' pubspec.yaml \
            | sed 's/version: *//' \
            | cut -d'+' -f1)

          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f1,2)

          BUILD_NAME="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"

          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"

          echo "Version marketing : $BUILD_NAME"
          echo "Build number      : $GITHUB_RUN_NUMBER"


      # ============================================================
      # FLUTTER IOS PROJECT
      # ============================================================
      - name: Générer le projet iOS
        run: |
          set -e

          echo "DEVELOPMENT_TEAM = $TEAM_ID" \
            >> ios/Flutter/Release.xcconfig

          echo "DEVELOPMENT_TEAM = $TEAM_ID" \
            >> ios/Flutter/Debug.xcconfig

          flutter build ios \
            --release \
            --no-codesign \
            --no-pub \
            --build-number="$GITHUB_RUN_NUMBER" \
            --build-name="$BUILD_NAME"


      # ============================================================
      # PODS
      # ============================================================
      - name: Installer CocoaPods
        run: |
          set -e

          cd ios

          pod install --repo-update


      # ============================================================
      # CONFIGURER LES ENTITLEMENTS RUNNER
      # ============================================================
      - name: Configurer les entitlements Push Notifications
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURATION ENTITLEMENTS"
          echo "======================================"

          cat > ios/Runner/Runner.entitlements <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>aps-environment</key>
              <string>production</string>
          </dict>
          </plist>
          EOF

          echo "Entitlements créés :"
          cat ios/Runner/Runner.entitlements


      # ============================================================
      # NETTOYER LES REFERENCES ENTITLEMENTS DES PODS
      # ============================================================
      - name: Corriger les entitlements des Pods
        run: |
          set -e

          echo "======================================"
          echo "NETTOYAGE PODS"
          echo "======================================"

          find ios/Pods -name "*.pbxproj" -type f -print0 |
          while IFS= read -r -d '' file; do

            if grep -q "Runner/Runner.entitlements" "$file"; then
              echo "Correction : $file"

              sed -i '' \
                's#Runner/Runner.entitlements##g' \
                "$file"
            fi

          done

          echo "Références Pods corrigées."


      # ============================================================
      # CONFIGURATION XCODE PROJECT
      # ============================================================
      - name: Configurer le projet Xcode
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURATION XCODE PROJECT"
          echo "======================================"

          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          project.targets.each do |target|

            puts "Target: #{target.name}"

            # Seulement le target principal Runner
            next unless target.name == 'Runner'

            target.build_configurations.each do |config|

              puts "  Configuration: #{config.name}"

              settings = config.build_settings

              settings['PRODUCT_BUNDLE_IDENTIFIER'] = 'com.kartapp.app'
              settings['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']

              settings['CODE_SIGN_STYLE'] = 'Manual'

              settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] =
                'Apple Distribution'

              settings['CODE_SIGN_ENTITLEMENTS'] =
                'Runner/Runner.entitlements'

              settings['PROVISIONING_PROFILE_SPECIFIER'] =
                ENV['PROFILE_UUID']

              settings['CODE_SIGNING_ALLOWED'] = 'YES'
              settings['CODE_SIGNING_REQUIRED'] = 'YES'

            end
          end

          project.save

          puts "Projet Xcode configuré correctement."
          RUBY


      # ============================================================
      # CERTIFICAT DISTRIBUTION + PROFILE
      # ============================================================
      - name: Générer certificat Distribution et profil App Store
        env:
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          set -e

          python3 <<'PYEOF'
          import jwt
          import time
          import json
          import urllib.request
          import urllib.parse
          import base64
          import os
          import subprocess
          import sys

          key_id = os.environ["KEY_ID"]
          issuer_id = os.environ["ISSUER_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          team_id = os.environ["TEAM_ID"]

          key_path = os.path.expanduser(
              f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8"
          )

          with open(key_path) as f:
              private_key = f.read()

          def token():

              now = int(time.time())

              payload = {
                  "iss": issuer_id,
                  "iat": now,
                  "exp": now + 1200,
                  "aud": "appstoreconnect-v1"
              }

              return jwt.encode(
                  payload,
                  private_key,
                  algorithm="ES256",
                  headers={"kid": key_id}
              )

          def request(url, data=None, method=None):

              headers = {
                  "Authorization": f"Bearer {token()}",
                  "Content-Type": "application/json"
              }

              body = None

              if data is not None:
                  body = json.dumps(data).encode()

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=headers,
                  method=method or ("POST" if body else "GET")
              )

              with urllib.request.urlopen(req) as response:
                  content = response.read()

                  if not content:
                      return {}

                  return json.loads(content)

          print("======================================")
          print("CERTIFICAT DISTRIBUTION")
          print("======================================")

          certs = request(
              "https://api.appstoreconnect.apple.com/v1/certificates"
              "?filter[certificateType]=IOS_DISTRIBUTION&limit=20"
          )

          distribution_certs = certs.get("data", [])

          cert_id = None
          cert_content = None
          local_key = False

          if distribution_certs:

              distribution_certs.sort(
                  key=lambda x: x["attributes"]["expirationDate"],
                  reverse=True
              )

              cert = distribution_certs[0]

              cert_id = cert["id"]
              cert_content = cert["attributes"]["certificateContent"]

              print(
                  f"✅ Certificat existant réutilisé : {cert_id}"
              )

          else:

              print("Aucun certificat Distribution trouvé.")

              print("Création d'un nouveau certificat...")

              subprocess.run(
                  [
                      "openssl",
                      "genrsa",
                      "-out",
                      "/tmp/distribution.key",
                      "2048"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "openssl",
                      "req",
                      "-new",
                      "-key",
                      "/tmp/distribution.key",
                      "-out",
                      "/tmp/distribution.csr",
                      "-subj",
                      "/CN=Apple Distribution/O=KartApp/C=US"
                  ],
                  check=True
              )

              with open("/tmp/distribution.csr", "rb") as f:
                  csr = base64.b64encode(f.read()).decode()

              cert_data = request(
                  "https://api.appstoreconnect.apple.com/v1/certificates",
                  {
                      "data": {
                          "type": "certificates",
                          "attributes": {
                              "certificateType": "IOS_DISTRIBUTION",
                              "csrContent": csr
                          }
                      }
                  }
              )

              cert_id = cert_data["data"]["id"]

              cert_content = cert_data["data"]["attributes"][
                  "certificateContent"
              ]

              local_key = True

              print(
                  f"✅ Nouveau certificat créé : {cert_id}"
              )

          with open("/tmp/distribution.cer", "wb") as f:
              f.write(base64.b64decode(cert_content))

          # ========================================================
          # BUNDLE ID
          # ========================================================

          encoded_bundle = urllib.parse.quote(
              bundle_id,
              safe=""
          )

          bundle_data = request(
              "https://api.appstoreconnect.apple.com/v1/bundleIds"
              f"?filter[identifier]={encoded_bundle}"
          )

          if not bundle_data.get("data"):
              raise Exception(
                  f"Bundle ID {bundle_id} introuvable."
              )

          bundle_resource_id = bundle_data["data"][0]["id"]

          print(
              f"Bundle Resource ID : {bundle_resource_id}"
          )

          # ========================================================
          # SUPPRIMER LES ANCIENS PROFILS KARTAPP
          # ========================================================

          print("")
          print("Nettoyage des anciens profils...")

          profiles = request(
              "https://api.appstoreconnect.apple.com/v1/profiles"
              "?filter[profileType]=IOS_APP_STORE&limit=50"
          )

          for profile in profiles.get("data", []):

              name = profile["attributes"]["name"]

              if "KartApp AppStore CI" in name:

                  profile_id = profile["id"]

                  print(
                      f"Suppression profil : {name}"
                  )

                  try:

                      request(
                          f"https://api.appstoreconnect.apple.com/v1/profiles/{profile_id}",
                          method="DELETE"
                      )

                  except Exception as e:

                      print(
                          f"Impossible de supprimer {profile_id}: {e}"
                      )

          # ========================================================
          # CREATION DU PROFILE
          # ========================================================

          print("")
          print("Création du provisioning profile...")

          profile_data = request(
              "https://api.appstoreconnect.apple.com/v1/profiles",
              {
                  "data": {
                      "type": "profiles",
                      "attributes": {
                          "name": (
                              f"KartApp AppStore CI "
                              f"{int(time.time())}"
                          ),
                          "profileType": "IOS_APP_STORE"
                      },
                      "relationships": {
                          "bundleId": {
                              "data": {
                                  "type": "bundleIds",
                                  "id": bundle_resource_id
                              }
                          },
                          "certificates": {
                              "data": [
                                  {
                                      "type": "certificates",
                                      "id": cert_id
                                  }
                              ]
                          }
                      }
                  }
              }
          )

          profile = profile_data["data"]

          profile_content = profile["attributes"]["profileContent"]

          profile_uuid = profile["attributes"]["uuid"]

          profile_name = profile["attributes"]["name"]

          with open(
              "/tmp/profile.mobileprovision",
              "wb"
          ) as f:

              f.write(
                  base64.b64decode(profile_content)
              )

          print("")
          print("======================================")
          print("PROFILE")
          print("======================================")

          print(f"Nom  : {profile_name}")
          print(f"UUID : {profile_uuid}")

          with open("/tmp/profile_uuid.txt", "w") as f:
              f.write(profile_uuid)

          # ========================================================
          # IMPORT CERTIFICAT SI NOUVELLE CLÉ LOCALE
          # ========================================================

          if local_key:

              print("Import du certificat local...")

              subprocess.run(
                  [
                      "openssl",
                      "x509",
                      "-inform",
                      "DER",
                      "-in",
                      "/tmp/distribution.cer",
                      "-out",
                      "/tmp/distribution.pem"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "openssl",
                      "pkcs12",
                      "-export",
                      "-inkey",
                      "/tmp/distribution.key",
                      "-in",
                      "/tmp/distribution.pem",
                      "-out",
                      "/tmp/distribution.p12",
                      "-passout",
                      "pass:tempci123",
                      "-legacy"
                  ],
                  check=True
              )

              keychain = (
                  os.environ["RUNNER_TEMP"]
                  + "/app-signing.keychain-db"
              )

              subprocess.run(
                  [
                      "security",
                      "create-keychain",
                      "-p",
                      "temppass",
                      keychain
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "security",
                      "set-keychain-settings",
                      "-lut",
                      "21600",
                      keychain
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "security",
                      "unlock-keychain",
                      "-p",
                      "temppass",
                      keychain
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "security",
                      "import",
                      "/tmp/distribution.p12",
                      "-k",
                      keychain,
                      "-P",
                      "tempci123",
                      "-A"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "security",
                      "list-keychain",
                      "-d",
                      "user",
                      "-s",
                      keychain
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "security",
                      "set-key-partition-list",
                      "-S",
                      "apple-tool:,apple:",
                      "-s",
                      "-k",
                      "temppass",
                      keychain
                  ],
                  check=True
              )

          # ========================================================
          # INSTALL PROFILE
          # ========================================================

          profiles_dir = os.path.expanduser(
              "~/Library/MobileDevice/Provisioning Profiles"
          )

          os.makedirs(
              profiles_dir,
              exist_ok=True
          )

          destination = os.path.join(
              profiles_dir,
              f"{profile_uuid}.mobileprovision"
          )

          with open(
              "/tmp/profile.mobileprovision",
              "rb"
          ) as source, open(
              destination,
              "wb"
          ) as dest:

              dest.write(source.read())

          print("")
          print(
              "✅ Provisioning profile installé."
          )

          with open("/tmp/profile_uuid.txt") as f:
              profile_uuid = f.read().strip()

          with open(
              os.environ["GITHUB_ENV"],
              "a"
          ) as env:

              env.write(
                  f"PROFILE_UUID={profile_uuid}\n"
              )

          PYEOF


      # ============================================================
      # CONFIGURATION FINALE XCODE
      # ============================================================
      - name: Appliquer le profil de provisioning
        run: |
          set -e

          echo "======================================"
          echo "PROVISIONING PROFILE"
          echo "======================================"

          echo "PROFILE_UUID=$PROFILE_UUID"

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/Runner.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          project.targets.each do |target|

            next unless target.name == 'Runner'

            target.build_configurations.each do |config|

              settings = config.build_settings

              settings['PRODUCT_BUNDLE_IDENTIFIER'] =
                'com.kartapp.app'

              settings['DEVELOPMENT_TEAM'] =
                ENV['TEAM_ID']

              settings['CODE_SIGN_STYLE'] =
                'Manual'

              settings['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] =
                'Apple Distribution'

              settings['PROVISIONING_PROFILE_SPECIFIER'] =
                ENV['PROFILE_UUID']

              settings['CODE_SIGN_ENTITLEMENTS'] =
                'Runner/Runner.entitlements'

            end
          end

          project.save

          puts "✅ Runner configuré."
          RUBY


      # ============================================================
      # VÉRIFICATION PROFIL
      # ============================================================
      - name: Vérifier le provisioning profile
        run: |
          set -e

          echo "======================================"
          echo "VÉRIFICATION PROFILE"
          echo "======================================"

          security cms \
            -D \
            -i "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
            > /tmp/profile.plist

          echo "Entitlements du profil :"

          /usr/libexec/PlistBuddy \
            -c "Print :Entitlements" \
            /tmp/profile.plist

          APS_ENV=$(
            /usr/libexec/PlistBuddy \
              -c "Print :Entitlements:aps-environment" \
              /tmp/profile.plist \
              2>/dev/null || echo "MISSING"
          )

          echo ""
          echo "aps-environment = $APS_ENV"

          if [ "$APS_ENV" != "production" ]; then
            echo "::error::Le provisioning profile ne contient pas aps-environment=production."
            exit 1
          fi

          echo "✅ Push Notifications autorisées dans le profil."


      # ============================================================
      # CLEAN
      # ============================================================
      - name: Nettoyer DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*


      # ============================================================
      # ARCHIVE
      # ============================================================
      - name: Archiver l'application
        run: |
          set -o pipefail

          echo "======================================"
          echo "ARCHIVE"
          echo "======================================"

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/archive/Runner.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            CODE_SIGN_ENTITLEMENTS="Runner/Runner.entitlements" \
            CODE_SIGNING_ALLOWED=YES \
            archive \
            2>&1 | tee /tmp/xcodebuild-archive.log


      # ============================================================
      # VÉRIFIER ARCHIVE
      # ============================================================
      - name: Vérifier archive
        run: |
          set -e

          echo "======================================"
          echo "ARCHIVE VALIDATION"
          echo "======================================"

          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app introuvable dans l'archive."
            exit 1
          fi

          echo "Application : $APP_PATH"

          echo ""
          echo "Entitlements signés :"

          codesign \
            -d \
            --entitlements :- \
            "$APP_PATH" \
            2>/tmp/codesign.err \
            > /tmp/archive-entitlements.plist || true

          if [ -s /tmp/archive-entitlements.plist ]; then

            /usr/libexec/PlistBuddy \
              -c "Print" \
              /tmp/archive-entitlements.plist

          else

            cat /tmp/codesign.err

          fi


      # ============================================================
      # EXPORT OPTIONS
      # ============================================================
      - name: Créer ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>

              <key>destination</key>
              <string>export</string>

              <key>method</key>
              <string>app-store-connect</string>

              <key>signingStyle</key>
              <string>manual</string>

              <key>teamID</key>
              <string>${TEAM_ID}</string>

              <key>provisioningProfiles</key>
              <dict>
                  <key>${BUNDLE_ID}</key>
                  <string>${PROFILE_UUID}</string>
              </dict>

              <key>signingCertificate</key>
              <string>Apple Distribution</string>

              <key>uploadSymbols</key>
              <true/>

              <key>compileBitcode</key>
              <false/>

          </dict>
          </plist>
          EOF

          echo "ExportOptions.plist :"
          cat ios/ExportOptions.plist


      # ============================================================
      # EXPORT IPA
      # ============================================================
      - name: Exporter IPA
        run: |
          set -o pipefail

          echo "======================================"
          echo "EXPORT IPA"
          echo "======================================"

          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa

          xcodebuild \
            -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist \
            2>&1 | tee /tmp/xcodebuild-export.log


      # ============================================================
      # VÉRIFIER IPA + APS
      # ============================================================
      - name: Vérifier aps-environment dans IPA
        run: |
          set -e

          echo "======================================"
          echo "VÉRIFICATION IPA"
          echo "======================================"

          IPA_PATH=$(find build/ios/ipa \
            -maxdepth 1 \
            -name "*.ipa" \
            | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "::error::Aucun IPA trouvé."
            exit 1
          fi

          echo "IPA : $IPA_PATH"

          rm -rf /tmp/ipa_check
          mkdir -p /tmp/ipa_check

          unzip -q "$IPA_PATH" -d /tmp/ipa_check

          APP_PATH=$(
            find /tmp/ipa_check/Payload \
              -maxdepth 1 \
              -name "*.app" \
              | head -1
          )

          if [ -z "$APP_PATH" ]; then
            echo "::error::Application .app introuvable."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "ENTITLEMENTS SIGNÉS"
          echo "======================================"

          codesign \
            -d \
            --entitlements :- \
            "$APP_PATH" \
            2>/tmp/final-codesign.err \
            > /tmp/final-entitlements.plist || true

          if [ ! -s /tmp/final-entitlements.plist ]; then

            echo "::error::Aucun entitlement trouvé."

            cat /tmp/final-codesign.err

            exit 1

          fi

          /usr/libexec/PlistBuddy \
            -c "Print" \
            /tmp/final-entitlements.plist

          APS_ENV=$(
            /usr/libexec/PlistBuddy \
              -c "Print :aps-environment" \
              /tmp/final-entitlements.plist \
              2>/dev/null || echo "MISSING"
          )

          echo ""
          echo "======================================"
          echo "APS ENVIRONMENT"
          echo "======================================"

          echo "aps-environment = $APS_ENV"

          if [ "$APS_ENV" != "production" ]; then

            echo "::error::aps-environment n'est pas production."

            echo ""
            echo "Entitlements trouvés :"

            cat /tmp/final-entitlements.plist

            exit 1
          fi

          echo ""
          echo "✅ aps-environment = production"
          echo "✅ Push Notifications présentes dans le binaire."


      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================
      - name: Sauvegarder IPA
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-iOS
          path: build/ios/ipa/*.ipa


      # ============================================================
      # UPLOAD APP STORE CONNECT
      # ============================================================
      - name: Soumettre à App Store Connect
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/flutter'
        run: |
          set -e

          IPA_PATH=$(find build/ios/ipa \
            -name "*.ipa" \
            | head -1)

          if [ -z "$IPA_PATH" ]; then
            echo "::error::IPA introuvable."
            exit 1
          fi

          echo "Upload : $IPA_PATH"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" \
            --verbose


      # ============================================================
      # CLEAN KEYCHAIN
      # ============================================================
      - name: Nettoyer le trousseau
        if: always()
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/app-signing.keychain-db" \
            2>/dev/null || true
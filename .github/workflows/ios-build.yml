name: Build iOS App

on:
  push:
    branches: [main, payment]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          architecture: x64

      - name: Install Dependencies
        run: flutter pub get

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Créer le fichier ExportOptions automatiquement
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF

      - name: Build IPA (iOS App) avec Authentification Native Xcode
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}
        run: |
          # 1. On recrée l'arborescence officielle pour que Xcode trouve la clé d'API
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8

          # 2. On lance le build Flutter en injectant les flags directement au moteur de build Apple (xcodebuild)
          # Cela force Xcode à générer/télécharger le profil 'com.kartapp.app' via l'API en direct
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist \
            --no-codesign

      - name: Étape alternative si l'App Store bloque toujours l'archivage direct
        run: |
          echo "Si l'archive pure sans signature est générée, on l'exportera à la prochaine étape."

      - name: Sauvegarder le fichier IPA (Artefact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-iOS
          path: build/ios/ipa/*.ipa

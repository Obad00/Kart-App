name: Build Android App Bundle

# Lancé au même push sur release/flutter que ios-build.yml, donc sur le
# même commit, avec la même version (scripts/ci_version.sh). L'AAB signé est
# déposé en artifact ; l'envoi à la Play Console reste manuel. Lancement à la
# main toujours possible (workflow_dispatch).
on:
  push:
    branches: [release/flutter]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier la branche (release/flutter uniquement)
        if: github.ref != 'refs/heads/release/flutter'
        run: |
          echo "::error::Build refusé : les builds de publication partent uniquement de release/flutter (branche actuelle : ${GITHUB_REF_NAME}). Fusionnez dans release/flutter, puis poussez."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historique complet : la version vient du nombre de commits.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get

      - name: Calculer la version (commune iOS + Android, toujours croissante)
        # versionCode = nombre de commits, versionName = même formule que
        # iOS : le même commit donne la même version sur les deux stores.
        # S'arrête si le numéro n'est pas supérieur à 220 (App Store) ni au
        # dernier versionCode Play Store (variable ANDROID_LAST_VERSION_CODE).
        env:
          ANDROID_LAST_VERSION_CODE: ${{ vars.ANDROID_LAST_VERSION_CODE }}
        run: ./scripts/ci_version.sh

      - name: Préparer le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant — voir la documentation de signature Android du projet."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/kart-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../kart-release.jks
          EOF

      - name: Build App Bundle signé
        run: flutter build appbundle --release --build-number=$BUILD_NUMBER --build-name=$BUILD_NAME

      - name: Sauvegarder l'App Bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-android-aab
          path: build/app/outputs/bundle/release/*.aab

name: Build & Deploy Android App

# Lancé au même push sur release/flutter que ios-build.yml, donc sur le
# même commit, avec la même version (scripts/ci_version.sh). Produit un APK
# et un AAB signés avec la clé d'upload, les dépose en artifacts, puis envoie
# l'AAB sur le Play Store (piste interne par défaut). Lancement à la main
# possible (workflow_dispatch) pour choisir une autre piste.
on:
  push:
    branches: [release/flutter, ci/android-cicd]
  workflow_dispatch:
    inputs:
      track:
        description: "Piste Play Store"
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

# Un seul déploiement Android à la fois : deux pushes rapprochés ne doivent
# pas envoyer deux AAB en parallèle à la Play Console.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Vérifier la branche (release/flutter, ou ci/android-cicd pour tester)
        # ci/android-cicd sert à tester ce workflow sans relancer le build
        # iOS de release/flutter ; il ne publie que sur la piste interne.
        if: github.ref != 'refs/heads/release/flutter' && github.ref != 'refs/heads/ci/android-cicd'
        run: |
          echo "::error::Build refusé : les builds de publication partent uniquement de release/flutter ou ci/android-cicd (branche actuelle : ${GITHUB_REF_NAME}). Fusionnez dans release/flutter, puis poussez."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Historique complet : la version vient du nombre de commits.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Calculer la version (commune iOS + Android, toujours croissante)
        # versionCode = nombre de commits, versionName = même formule que
        # iOS : le même commit donne la même version sur les deux stores.
        # S'arrête si le numéro n'est pas supérieur à 220 (App Store) ni au
        # dernier versionCode Play Store (variable ANDROID_LAST_VERSION_CODE).
        env:
          ANDROID_LAST_VERSION_CODE: ${{ vars.ANDROID_LAST_VERSION_CODE }}
        run: ./scripts/ci_version.sh

      - name: Préparer le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret ANDROID_${name} manquant — voir la documentation de signature Android du projet."
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > android/kart-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../kart-release.jks
          EOF

      - name: Build App Bundle signé
        run: flutter build appbundle --release --build-number=$BUILD_NUMBER --build-name=$BUILD_NAME

      - name: Build APK signé
        run: flutter build apk --release --build-number=$BUILD_NUMBER --build-name=$BUILD_NAME

      - name: Vérifier la signature (clé d'upload, pas la clé debug)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee signature.txt
          if grep -q "CN=Android Debug" signature.txt; then
            echo "::error::APK signé avec la clé debug : vérifiez key.properties et les secrets."
            exit 1
          fi
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab > /dev/null
          echo "AAB signé correctement."

      - name: Renommer les binaires avec la version
        run: |
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab "dist/KartApp-${BUILD_NAME}-${BUILD_NUMBER}.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/KartApp-${BUILD_NAME}-${BUILD_NUMBER}.apk"

      - name: Sauvegarder l'App Bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-android-aab-${{ env.BUILD_NAME }}
          path: dist/*.aab

      - name: Sauvegarder l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-android-apk-${{ env.BUILD_NAME }}
          path: dist/*.apk

      - name: Sauvegarder le mapping R8 (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-android-mapping-${{ env.BUILD_NAME }}
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      - name: Vérifier l'accès Play Store
        id: play
        env:
          PLAY_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::warning::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON manquant : publication Play Store ignorée, binaires disponibles en artifacts."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier sur le Play Store
        # Compte de service Google Cloud lié à la Play Console (droit
        # « Publier sur les pistes de test » au minimum). L'application doit
        # déjà exister dans la Play Console avec un premier AAB envoyé à la main.
        if: steps.play.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.kartapp.app
          releaseFiles: dist/*.aab
          releaseName: ${{ env.BUILD_NAME }} (${{ env.BUILD_NUMBER }})
          track: ${{ github.ref == 'refs/heads/release/flutter' && inputs.track || 'internal' }}
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt

      - name: Nettoyer le keystore
        if: always()
        run: rm -f android/kart-release.jks android/key.properties

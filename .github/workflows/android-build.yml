name: Build Android App Bundle

# Déclenchement manuel uniquement pour l'instant — le tout premier envoi
# vers le Play Store doit être fait à la main depuis la Play Console (Google
# ne permet pas l'envoi via API tant qu'aucune version n'a jamais été
# publiée pour l'app). Une fois cette première version en ligne, ce workflow
# pourra être étendu pour se déclencher sur push (comme ios-build.yml) et
# envoyer directement à la Play Console via l'API.
on:
  workflow_dispatch:
  # Temporaire : vérifie la compilation (canal natif) et le manifeste
  # fusionné de feature/event-invitations. À retirer avant la fusion.
  push:
    branches: [feature/event-invitations]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install Dependencies
        run: flutter pub get

      - name: Calculer la version (toujours strictement croissante)
        # Le versionCode Android doit être strictement croissant entre deux
        # envois — même logique que pour iOS (voir ios-build.yml) :
        # MAJOR.MINOR fixé dans pubspec.yaml, PATCH = run number CI.
        run: |
          BASE_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          MAJOR_MINOR=$(echo "$BASE_VERSION" | cut -d'.' -f1,2)
          echo "BUILD_NAME=${MAJOR_MINOR}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Préparer le keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            # Temporaire (vérification de feature/event-invitations) : sans
            # secret, clé jetable pour compiler la release complète. L'AAB
            # obtenu n'est PAS publiable (mauvaise clé de signature).
            if [ "${{ github.ref_name }}" != "feature/event-invitations" ]; then
              echo "::error::Secret ANDROID_KEYSTORE_BASE64 manquant — voir la documentation de signature Android du projet."
              exit 1
            fi
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : AAB de vérification signé avec une clé jetable, à ne pas publier."
            KEY_ALIAS=verification
            KEY_PASSWORD=verification
            STORE_PASSWORD=verification
            keytool -genkeypair -keystore android/kart-release.jks -alias "$KEY_ALIAS" \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=KART verification" -keyalg RSA -keysize 2048 -validity 2
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/kart-release.jks
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../kart-release.jks
          EOF

      - name: Build App Bundle signé
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --build-name=$BUILD_NAME

      - name: Sauvegarder l'App Bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-android-aab
          path: build/app/outputs/bundle/release/*.aab

      # Temporaire : manifeste fusionné (permissions finales), lisible tel quel.
      - name: Sauvegarder le manifeste fusionné (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: KartApp-android-merged-manifest
          path: build/app/intermediates/merged_manifest*/release/**/AndroidManifest.xml

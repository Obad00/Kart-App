name: kart_app
description: Application mobile KART (carte de visite digitale)
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.2.5

  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.12.0

  dio: ^5.4.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.0.0
  flutter_svg: ^2.0.0
  share_plus: ^12.0.1
  path_provider: ^2.0.15
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  device_info_plus: ^10.1.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.0.7
  google_sign_in: ^6.2.1
  webview_flutter: ^4.7.0
  image_cropper: ^8.0.2
  lottie: ^3.1.0
  google_fonts: ^6.1.0
  camera: ^0.10.5+5
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 # ← downgrade : ^6.0.0 requiert Dart 3.8+
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

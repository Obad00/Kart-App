name: kart_app
description: Application mobile KART (carte de visite digitale)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # URL launcher
  url_launcher: ^6.2.5


  # Icons
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.4.0

  # HTTP client (API Laravel)
  dio: ^5.4.0

  # State management
  provider: ^6.1.2

  # Secure storage (token Sanctum)
  flutter_secure_storage: ^9.0.0

  # SVG rendering
  flutter_svg: ^2.0.0
  share_plus: ^12.0.1
  path_provider: ^2.0.15
  shared_preferences: ^2.2.2

  # Utils
  intl: ^0.19.0

  #dependance scanner
  mobile_scanner: ^5.0.0

  # Image picker
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
